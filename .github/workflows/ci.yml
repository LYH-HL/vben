name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧任务自动取消，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + format + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # 版本写死在这里：不在 package.json 声明 packageManager，
      # 否则 pnpm 12 会把它当成「要管理的包管理器依赖」重写 lockfile，
      # 把项目依赖的 importer 段覆盖掉（已踩过一次）。
      # action-setup v6 才正式支持 pnpm v12（v4 会按老版本处理）。
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装后端依赖
        working-directory: server
        run: pnpm install --frozen-lockfile

      # 后端缺少 JWT_SECRET 会拒绝启动，这里生成一个仅用于 CI 的随机密钥
      - name: 生成后端 .env
        working-directory: server
        run: |
          node -e 'const fs=require("node:fs");const s=require("node:crypto").randomBytes(32).toString("hex");fs.writeFileSync(".env","PORT=3001\nJWT_SECRET="+s+"\nJWT_EXPIRES=7d\n");'

      - name: 代码规范（ESLint）
        run: pnpm lint

      - name: 格式检查（Prettier）
        run: pnpm format:check

      # 用独立临时库跑真实 HTTP，覆盖登录/权限/成绩外键/限流等 33 项
      - name: 接口集成测试
        run: pnpm test:api

      - name: 生产构建
        run: pnpm build
